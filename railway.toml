[build]
builder = "DOCKERFILE"
buildPath = "/"

[deploy]
startCommand = "python run.py"
# v5.1: healthcheck روی همان مسیر API — Railway قبل از سوییچ ترافیک مطمئن می‌شود
# سرویس بالا آمده و دیتابیس سالم است (جلوگیری از حلقهٔ "deploy موفق ولی ربات مرده").
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
